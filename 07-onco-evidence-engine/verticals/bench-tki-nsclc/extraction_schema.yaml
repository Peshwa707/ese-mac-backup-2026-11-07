# Data dictionary for the alectinib vs crizotinib ALK+ NSCLC benchmark
# (pairwise RCT meta-analysis; reference PMID 34915469; DOI 10.1159/000521452).
# Field names align with the engine's generic inverse-variance log-effect pooling:
# pfs_hr / os_hr are log-effect fields (parsed by parse_hr_ci); no subgroup axis
# (subgroup_field = "" in pico.yaml) so all studies pool into the "ALL" group.
fields:
  population:
    - {name: trial_name, level: abstract}           # ALEX | ALESIA | J-ALEX
    - {name: total_n, level: abstract}               # total randomized participants
    - {name: n_alectinib, level: abstract}           # N in alectinib arm
    - {name: n_crizotinib, level: abstract}          # N in crizotinib arm
    - {name: line_of_therapy, level: abstract}       # first-line | second-line
    - {name: study_phase, level: abstract}           # phase I | II | III
    - {name: country_region, level: abstract}        # global | Japan | Asia
    - {name: median_follow_up, level: abstract}      # months if reported
  efficacy:
    # Adjusted HR (alectinib vs crizotinib) + 95% CI, per outcome.
    # Format verbatim: "HR 0.35 (95% CI 0.25-0.49)" or "0.35 [0.25, 0.49]".
    # NR if the study does not report the hazard ratio with 95% CI.
    - {name: pfs_hr, level: abstract, pool: log_effect, label: "PFS (HR, alectinib vs crizotinib)"}
    - {name: os_hr, level: abstract, pool: log_effect, label: "OS (HR, alectinib vs crizotinib)"}
    - {name: cns_pfs_hr, level: abstract, pool: log_effect, label: "CNS-PFS (HR, alectinib vs crizotinib)"}
  response:
    - {name: orr_alectinib, level: abstract}         # ORR % in alectinib arm
    - {name: orr_crizotinib, level: abstract}        # ORR % in crizotinib arm
  safety:
    - {name: grade3plus_ae_alectinib, level: abstract}   # grade >=3 AE rate %
    - {name: grade3plus_ae_crizotinib, level: abstract}

rules:
  - "Copy values verbatim from the source text only. Do not use outside knowledge."
  - "If a field is not stated, set value to 'NR'. Derived/computed values: prefix 'ESTIMATED:'."
  - "For each non-NR numeric value, include the exact verbatim supporting quote."
  - "pfs_hr / os_hr / cns_pfs_hr = the HAZARD RATIO (alectinib vs crizotinib) WITH its 95% CI. HR < 1 indicates benefit for alectinib."
  - "If the paper reports alectinib-to-crizotinib HR, record as is. If inverted (crizotinib vs alectinib), note 'ESTIMATED: inverted' and provide the reciprocal."
  - "Do NOT fabricate HR values. If absent from abstract and full text unavailable, set to NR."
  - "Record trial_name (ALEX / ALESIA / J-ALEX) if identifiable from the text."
