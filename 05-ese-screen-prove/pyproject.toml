[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-synthesis-engine-screen-prove"
version = "0.1.0"
description = "Offline Screen-and-Prove slice for reproducible AI-assisted evidence screening."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
screen-prove = "screen_prove.cli:main"

[tool.setuptools.packages.find]
include = ["screen_prove*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
