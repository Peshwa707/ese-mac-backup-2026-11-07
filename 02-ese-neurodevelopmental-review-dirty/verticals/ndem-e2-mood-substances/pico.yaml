review:
  title: Mood and Substance State Modifiers in ADHD and Bipolar-Spectrum Differential Diagnosis
  short_id: ndem-e2-mood-substances
  registration: Protocol frozen for AI-assisted rapid review on 2026-07-29; not prospectively registered.
  output_base: /Users/neurologic/Documents/EvidenceEngine/neurodevelopmental-environmental-mismatch
pico:
  population: Adolescents and adults with ADHD, bipolar-spectrum disorder, both conditions, substance
    exposure, or relevant control groups.
  intervention: Hypomanic, manic, mixed, or psychotic state; cannabis or THC; prescribed stimulant; nicotine;
    medication change; or interactions among these exposures.
  comparator: Euthymia, abstinence, placebo, adequate sleep, unexposed controls, or within-person baseline.
  outcomes:
    primary:
    - Attention, executive function, speech, irritability, salience, impulsivity, psychosis, and mood
      instability
    - Evidence distinguishing lifelong traits from episodic state effects
    secondary:
    - Dose, timing, interaction, confounding, and vulnerability factors
eligibility:
  inclusion:
  - Adolescent or adult sample relevant to ADHD, bipolar-spectrum illness, cannabis/THC, prescription
    stimulants, or nicotine.
  - Reports cognitive, activation, manic, psychotic, speech, salience, impulse-control, or functional
    outcomes.
  - Provides empirical results or an authoritative professional guideline/evidence synthesis.
  exclusion:
  - Non-prescription stimulant exposure with no relevance to prescribed ADHD treatment or bipolar differential
    diagnosis.
  - No separable exposure or outcome relevant to claim H8.
  - Opinion, commercial treatment page, protocol, or unsourced narrative.
  - Case report retained only as a safety signal, not as causal or incidence evidence.
disclaimer: AI Reviewer-1 rapid-review draft. Human Reviewer 2 and clinical sign-off remain pending. Not
  diagnostic or treatment guidance.
