tool_by_design:
  cohort: nos_cohort
  case-cohort: nos_cohort
  prospective: nos_cohort
  registry: nos_cohort
  other: nos_cohort
  case-control: nos_cc
  nested case-control: nos_cc
judgments:
  nos_cohort:
  - '*'
  - '**'
  - --
  - No information
  nos_cc:
  - '*'
  - '**'
  - --
  - No information
tools:
  nos_cohort:
    name: Newcastle-Ottawa Scale — cohort studies (max 9 stars; high quality >=7)
    domains:
    - key: S1
      label: 'Selection: representativeness of the exposed cohort'
    - key: S2
      label: 'Selection: selection of the non-exposed cohort (same source)'
    - key: S3
      label: 'Selection: ascertainment of exposure (validated instrument)'
    - key: S4
      label: 'Selection: outcome not present at start of study'
    - key: C1
      label: 'Comparability: adjusts for the key confounders (up to **)'
    - key: O1
      label: 'Outcome: assessment of outcome (registry / linkage)'
    - key: O2
      label: 'Outcome: follow-up long enough for the outcome to occur'
    - key: O3
      label: 'Outcome: adequacy / completeness of follow-up'
  nos_cc:
    name: Newcastle-Ottawa Scale — case-control studies (max 9 stars; high quality >=7)
    domains:
    - key: S1
      label: 'Selection: case definition adequate (confirmed)'
    - key: S2
      label: 'Selection: representativeness of the cases'
    - key: S3
      label: 'Selection: selection of controls (same base population)'
    - key: S4
      label: 'Selection: definition of controls (no outcome history)'
    - key: C1
      label: 'Comparability: adjusts for the key confounders (up to **)'
    - key: E1
      label: 'Exposure: ascertainment of exposure (validated/blinded)'
    - key: E2
      label: 'Exposure: same ascertainment method for cases and controls'
    - key: E3
      label: 'Exposure: non-response rate same for both groups'
