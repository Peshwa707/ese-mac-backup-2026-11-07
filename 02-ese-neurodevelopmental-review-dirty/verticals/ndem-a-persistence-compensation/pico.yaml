review:
  title: Developmental Persistence, Executive Function, and Intellectual Compensation in ADHD
  short_id: ndem-a-persistence-compensation
  registration: Protocol frozen for AI-assisted rapid review on 2026-07-29; not prospectively registered.
  output_base: /Users/neurologic/Documents/EvidenceEngine/neurodevelopmental-environmental-mismatch
pico:
  population: Adolescents and adults with diagnosed ADHD or validated ADHD traits, including high-intelligence
    or high-achievement subgroups.
  intervention: Developmental persistence, executive dysfunction, intelligence, achievement, compensation,
    masking, or delayed recognition.
  comparator: Controls without ADHD, lower-intelligence or lower-achievement groups, remitted ADHD, or
    within-person developmental follow-up.
  outcomes:
    primary:
    - Persistence of symptoms or executive/functional impairment
    - Evidence for or against intelligence-related compensation or delayed recognition
    secondary:
    - Cross-setting impairment, effort, instability, quality of life, and alternative explanations
eligibility:
  inclusion:
  - Adolescent or adult ADHD population, or developmental follow-up into adulthood.
  - Evaluates persistence, executive/functional outcomes, intelligence, achievement, compensation, masking,
    or recognition.
  - Uses a defined diagnostic or validated trait measure.
  - Reports empirical results or an authoritative evidence synthesis.
  exclusion:
  - Pediatric-only report without developmental relevance beyond adolescence.
  - No separable ADHD population or validated ADHD-trait analysis.
  - Opinion, advocacy, protocol, or unsourced narrative without systematic empirical data.
  - No outcome relevant to claims H1 or H2.
disclaimer: AI Reviewer-1 rapid-review draft. Human Reviewer 2 and clinical sign-off remain pending. Not
  diagnostic or treatment guidance.
