version: "1.0.0"
overlap_policy: >
  Shared domains are the primary overlap unit. Pairwise diagnostic claims are
  permitted only when the study includes both diagnoses and a comparable measure.
domains:
  - {id: attention_executive, label: "Attention and executive function", diagnoses: [ADHD, ASD, SLD, DCD]}
  - {id: social_communication, label: "Social communication and interaction", diagnoses: [ADHD, ASD, SLD, DCD]}
  - {id: learning_language, label: "Learning, language, and academic skills", diagnoses: [ADHD, ASD, SLD, DCD]}
  - {id: motor_coordination, label: "Motor coordination and praxis", diagnoses: [ADHD, ASD, SLD, DCD]}
  - {id: sensory_processing, label: "Sensory processing and reactivity", diagnoses: [ADHD, ASD, SLD, DCD]}
  - {id: emotional_regulation, label: "Emotional regulation and reactivity", diagnoses: [ADHD, ASD, SLD, DCD]}
  - {id: sleep_arousal, label: "Sleep, arousal, and circadian regulation", diagnoses: [ADHD, ASD, SLD, DCD]}
  - {id: functional_participation, label: "Daily functioning and participation", diagnoses: [ADHD, ASD, SLD, DCD]}
mechanism_classes:
  - cognitive_attention
  - executive_control
  - reward_motivation
  - social_cognition
  - language_learning
  - motor_control
  - sensory_processing
  - arousal_sleep
  - emotional_regulation
  - environmental_transactional
