  - {id: psychotherapy_behavioral, label: "Psychotherapy and behavioral intervention"}
  - {id: education_occupational, label: "Educational, occupational, and environmental support"}
  - {id: assistive_digital, label: "Assistive and digital technology"}
  - {id: lifestyle_sleep_participation, label: "Lifestyle, sleep, and participation support"}
