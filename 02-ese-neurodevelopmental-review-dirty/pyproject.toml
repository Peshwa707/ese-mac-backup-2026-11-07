[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-synthesis-engine"
version = "0.1.0"
description = "Domain-neutral evidence synthesis engine: systematic review, meta-analysis, honesty-gated export."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "anyio>=4.0",
]

[project.scripts]
ese = "core.sr.driver.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=core --cov-report=term-missing"
markers = [
    "live: tests that require network access and ANTHROPIC_API_KEY",
]
